  <script>
    // Suppress + work around benign ResizeObserver loop warning
    const _isROLoop = (m) => typeof m === 'string' && m.includes('ResizeObserver loop');
    window.addEventListener('error', (e) => {
      if (_isROLoop(e.message)) { e.stopImmediatePropagation(); e.preventDefault(); }
    }, true);
    // Patch ResizeObserver to defer callbacks via requestAnimationFrame, which
    // prevents the loop from triggering in the first place.
    if (typeof ResizeObserver !== 'undefined') {
      const _RO = window.ResizeObserver;
      window.ResizeObserver = class extends _RO {
        constructor(cb) {
          super((entries, observer) => {
            requestAnimationFrame(() => {
              if (!Array.isArray(entries) || !entries.length) return;
              cb(entries, observer);
            });
          });
        }
      };
    }
    // Also silence console.error for this specific noise (some browsers route
    // the warning through console rather than an error event)
    const _origErr = console.error;
    console.error = (...args) => {
      if (args.some(a => _isROLoop(typeof a === 'string' ? a : a?.message))) return;
      _origErr.apply(console, args);
    };
  </script>
